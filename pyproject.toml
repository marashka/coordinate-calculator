[build-system]
requires = ["setuptools>=67.8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coordinate-calculator"
version = "0.1.0"
description = "Service that calculates spacecraft coordinates from orbital data"
readme = "README.md"
license = "MIT"
authors = [{name = "Marat Akhmetov"}]
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pydantic",
    "Framework :: Pydantic :: 2",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "alembic~=1.20.1",
    "asyncpg~=0.32.0",
    "fastapi~=0.162.0",
    "greenlet~=3.5.6",
    "pydantic~=2.14.2",
    "pydantic-settings~=2.16.2",
    "pydantic-settings-logging~=0.1.1",
    "pyyaml~=6.0.3",
    "sgp4~=2.27",
    "skyfield~=1.55",
    "sqlalchemy~=2.1.6",
    "sqlalchemy-utils~=0.43.0",
    "uvicorn~=0.54.0",
]

[tool.setuptools.packages.find]
include = ["coordinate_calculator*"]
exclude = ["tests"]

[tool.setuptools.package-data]
"*" = ["py.typed"]
"coordinate_calculator.db.migrations" = ["alembic.ini", "script.py.mako"]

[dependency-groups]
dev = [
    "factory-boy~=3.3.3",
    "httpx2~=2.16.0",
    "mypy~=2.4.1",
    "prek~=0.5.9",
    "psycopg[binary]~=3.3.6",
    "pytest~=9.2.0",
    "pytest-asyncio~=1.4.1",
    "pytest-factoryboy~=2.8.1",
    "ruff~=0.17.3",
]

[tool.uv]
default-groups = []
add-bounds = "minor"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["db: tests that need PostgreSQL"]

[tool.ruff]
line-length = 120
extend-exclude = ["Makefile"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["ARG", "ANN", "D", "TD", "FIX", "CPY001"]

[tool.ruff.lint.per-file-ignores]
"coordinate_calculator/db/migrations/*" = ["N999", "S"]
"coordinate_calculator/db/models/*" = ["TC"]
"coordinate_calculator/db/repositories/*" = ["TC", "UP046", "PLR0913", "A002"]
"coordinate_calculator/services/uow.py" = ["TC"]
"coordinate_calculator/services/coordinates.py" = ["TC"]
"coordinate_calculator/api/v1/router/*" = ["TC"]
"tests/**/*.py" = ["S101"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
multiline-quotes = "double"
docstring-quotes = "double"

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
strict_optional = true
packages = ["coordinate_calculator"]

[[tool.mypy.overrides]]
module = "sqlalchemy_utils"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pydantic_settings_logging"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sgp4", "sgp4.*", "skyfield", "skyfield.*"]
ignore_missing_imports = true
